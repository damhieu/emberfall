<!doctype html>
<html lang="vi"><meta charset="utf-8"><title>Render Emberfall promo</title>
<style>body{margin:0;background:#0b1320;color:#fff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{text-align:center}canvas{width:min(92vw,960px);box-shadow:0 20px 70px #000}button{margin:22px;padding:12px 22px;background:#e9aa55;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.55}</style>
<main><canvas width="1920" height="1080"></canvas><p id="status">Sẵn sàng render video WebM 1080p, 20 giây.</p><button id="render">Tạo video giới thiệu</button></main>
<script>
const c=document.querySelector('canvas'),x=c.getContext('2d'),status=document.querySelector('#status'),button=document.querySelector('#render');
function glow(cx,cy,r,color){const g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,color);g.addColorStop(1,'transparent');x.fillStyle=g;x.fillRect(cx-r,cy-r,r*2,r*2)}
function draw(t){const W=c.width,H=c.height;x.fillStyle='#07111e';x.fillRect(0,0,W,H);let sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#0a1930');sky.addColorStop(.55,'#142940');sky.addColorStop(1,'#07111e');x.fillStyle=sky;x.fillRect(0,0,W,H);x.fillStyle='#162c42';x.beginPath();x.moveTo(0,490);for(let i=0;i<=W;i+=100)x.lineTo(i,470-Math.sin(i*.006)*70-Math.cos(i*.014)*45);x.lineTo(W,650);x.lineTo(0,650);x.fill();glow(W*.5,H*.48,360,'rgba(238,145,60,.18)');x.fillStyle='#101d27';x.fillRect(0,610,W,470);let water=x.createLinearGradient(0,610,0,H);water.addColorStop(0,'#233a45');water.addColorStop(1,'#08151e');x.fillStyle=water;x.fillRect(0,610,W,H-610);for(let i=0;i<20;i++){const y=625+i*25,x0=220+Math.sin(i*7)*70,w=1500-i*55;x.strokeStyle=`rgba(117,176,194,${.15-i*.005})`;x.lineWidth=3;x.beginPath();x.moveTo(x0,y);x.lineTo(x0+w,y+Math.sin(t*2+i)*3);x.stroke()}const gateX=W/2,gateY=610;x.lineWidth=52;x.strokeStyle='#354653';x.beginPath();x.arc(gateX,gateY,225,Math.PI,0);x.stroke();x.fillStyle='#172630';x.fillRect(gateX-252,gateY,504,250);x.fillStyle='#060d15';x.beginPath();x.arc(gateX,gateY,178,Math.PI,0);x.lineTo(gateX+178,850);x.lineTo(gateX-178,850);x.fill();x.strokeStyle='#77808a';x.lineWidth=4;for(let a=Math.PI+.2;a<6.1;a+=.24){let px=gateX+225*Math.cos(a),py=gateY+225*Math.sin(a);x.beginPath();x.moveTo(px,py);x.lineTo(gateX+195*Math.cos(a),gateY+195*Math.sin(a));x.stroke()}glow(gateX,705,220,'rgba(255,148,55,.25)');for(let i=0;i<25;i++){const px=gateX+Math.sin(i*12.7+t*1.4)*185,py=760+((i*73+t*42)%240);glow(px,py,10,'rgba(255,184,72,.92)')}const fade=x.createLinearGradient(0,0,0,H);fade.addColorStop(0,'rgba(4,10,20,.58)');fade.addColorStop(.45,'rgba(4,10,20,0)');fade.addColorStop(1,'rgba(4,10,20,.66)');x.fillStyle=fade;x.fillRect(0,0,W,H);x.textAlign='center';if(t<5){x.fillStyle='#ffd892';x.font='bold 92px Georgia';x.fillText('EMBERFALL',W/2,154);x.font='32px system-ui';x.fillText('ÁNH LỬA CUỐI CÙNG',W/2,212)}if(t>4&&t<13){x.fillStyle='#fff';x.font='bold 42px system-ui';x.fillText('THU THẬP 5 EMBER. ĐÁNH THỨC CỔNG CỔ.',W/2,H-145)}if(t>12){x.fillStyle='#ffd892';x.font='bold 40px system-ui';x.fillText('CHƠI TRÊN MÁY TÍNH VÀ IPHONE',W/2,H-94)}}
draw(0);button.onclick=()=>{button.disabled=true;const ctx=new AudioContext(),out=ctx.createMediaStreamDestination();for(const [freq,volume] of [[55,.028],[110,.018],[220,.008]]){const o=ctx.createOscillator(),gain=ctx.createGain();o.frequency.value=freq;o.type='sine';gain.gain.value=volume;o.connect(gain).connect(out);o.start();o.stop(ctx.currentTime+20)}const stream=c.captureStream(30);stream.addTrack(out.stream.getAudioTracks()[0]);const rec=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9,opus',videoBitsPerSecond:8000000}),chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download='Emberfall-Facebook-Intro.webm';a.click();status.textContent='Đã tạo video.';button.disabled=false};rec.start(1000);const start=performance.now();(function frame(now){const t=(now-start)/1000;draw(t);status.textContent='Đang render '+Math.min(100,Math.round(t/20*100))+'%';if(t<20)requestAnimationFrame(frame);else rec.stop()})(start)};
</script></html>
