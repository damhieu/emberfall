<!doctype html><html lang="vi"><meta charset="utf-8"><title>Render Emberfall promo</title>
<style>body{margin:0;background:#0b1320;color:#fff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{text-align:center}canvas{width:min(92vw,960px);box-shadow:0 20px 70px #000}button{margin:22px;padding:12px 22px;background:#e9aa55;border:0;font-weight:700;cursor:pointer}</style>
<main><canvas width="1920" height="1080"></canvas><p id="status">Sẵn sàng render video WebM 1080p, 20 giây.</p><button id="render">Tạo video giới thiệu</button></main>
<script>
const c=document.querySelector('canvas'),x=c.getContext('2d'),status=document.querySelector('#status'),button=document.querySelector('#render'),img=new Image();img.src='./Emberfall-preview.png';
function draw(t){const W=c.width,H=c.height,zoom=1.06+t*.006,sw=img.width/zoom,sh=img.height/zoom,sx=(img.width-sw)/2+Math.sin(t*.35)*18,sy=(img.height-sh)/2+Math.cos(t*.22)*10;x.drawImage(img,sx,sy,sw,sh,0,0,W,H);const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(4,10,20,.64)');g.addColorStop(.38,'rgba(4,10,20,0)');g.addColorStop(1,'rgba(4,10,20,.6)');x.fillStyle=g;x.fillRect(0,0,W,H);x.textAlign='center';if(t<5){x.fillStyle='#ffd892';x.font='bold 92px Georgia';x.fillText('EMBERFALL',W/2,154);x.font='32px system-ui';x.fillText('ÁNH LỬA CUỐI CÙNG',W/2,212)}if(t>4&&t<13){x.fillStyle='#fff';x.font='bold 42px system-ui';x.fillText('THU THẬP 5 EMBER. ĐÁNH THỨC CỔNG CỔ.',W/2,H-145)}if(t>12){x.fillStyle='#ffd892';x.font='bold 40px system-ui';x.fillText('CHƠI TRÊN MÁY TÍNH VÀ IPHONE',W/2,H-94)}}
button.onclick=()=>{if(!img.complete){status.textContent='Đang tải ảnh game…';return}button.disabled=true;const ctx=new AudioContext(),out=ctx.createMediaStreamDestination();for(const [freq,volume] of [[55,.028],[110,.018],[220,.008]]){const o=ctx.createOscillator(),gain=ctx.createGain();o.frequency.value=freq;o.type='sine';gain.gain.value=volume;o.connect(gain).connect(out);o.start();o.stop(ctx.currentTime+20)}const stream=c.captureStream(30);stream.addTrack(out.stream.getAudioTracks()[0]);const rec=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9,opus',videoBitsPerSecond:8000000}),chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download='Emberfall-Facebook-Intro.webm';a.click();status.textContent='Đã tạo video.';button.disabled=false};rec.start(1000);const start=performance.now();(function frame(now){const t=(now-start)/1000;draw(t);status.textContent='Đang render '+Math.min(100,Math.round(t/20*100))+'%';if(t<20)requestAnimationFrame(frame);else rec.stop()})(start)};
</script></html>
