<!doctype html><html lang="vi"><meta charset="utf-8"><title>Emberfall gameplay demo</title>
<style>body{margin:0;background:#08121e;color:white;font:16px system-ui;text-align:center}iframe{width:min(96vw,1280px);height:min(72vw,720px);border:0;display:block;margin:18px auto;box-shadow:0 18px 55px #000}button{padding:13px 22px;background:#e9aa55;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.6}</style>
<h1>Emberfall — Gameplay Demo</h1><p id="status">Bấm nút để quay video demo gameplay thật, 20 giây.</p><button id="record">Tạo video gameplay</button><iframe id="game" src="./?demo=1" allow="autoplay"></iframe>
<script>
const frame=document.querySelector('#game'),button=document.querySelector('#record'),status=document.querySelector('#status');
button.onclick=()=>{button.disabled=true;frame.src='./?demo=1&take='+Date.now();status.textContent='Đang khởi động cảnh game…';frame.onload=()=>setTimeout(()=>{const canvas=frame.contentDocument.querySelector('canvas');if(!canvas||!canvas.captureStream){status.textContent='Không thể lấy khung hình game.';button.disabled=false;return}const audio=new AudioContext(),dest=audio.createMediaStreamDestination();for(const f of [55,110,220]){const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.type='sine';g.gain.value=.018;o.connect(g).connect(dest);o.start();o.stop(audio.currentTime+20)}const stream=canvas.captureStream(30);stream.addTrack(dest.stream.getAudioTracks()[0]);const rec=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9,opus',videoBitsPerSecond:9000000}),chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download='Emberfall-Gameplay-Demo.webm';a.click();status.textContent='Đã tạo video gameplay.';button.disabled=false};rec.start(1000);const started=performance.now();(function progress(now){const t=(now-started)/1000;status.textContent='Đang quay gameplay '+Math.min(100,Math.round(t/20*100))+'%';if(t<20)requestAnimationFrame(progress);else rec.stop()})(started)},900)};
</script></html>
